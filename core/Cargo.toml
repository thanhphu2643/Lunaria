[package]
name = "lunaria_core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Cross-platform menstrual cycle prediction and storage core for Lunaria"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "lunaria_core"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uniffi = { version = "0.29", features = ["cli"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
strip = false # leave stripping to Xcode
